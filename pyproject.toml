[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgdit"
version = "0.1.0"
description = "Symmetry-aware graph diffusion for crystal structure generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ase==3.26.0",
    "einops==0.8.1",
    "hydra-core==1.3.2",
    "matminer==0.9.3",
    "matplotlib==3.10.7",
    "networkx>=3.3,<4",
    "numpy==2.1.2",
    "omegaconf==2.3.0",
    "p-tqdm==1.4.2",
    "palettable==3.3.3",
    "pandas==2.2.3",
    "pathos==0.3.4",
    "pillow==11.3.0",
    "plotly==6.3.1",
    "pymatgen==2025.10.7",
    "pytorch-lightning==2.5.5",
    "python-dotenv==1.2.1",
    "pyxtal==1.1.1",
    "scikit-learn==1.7.2",
    "scipy==1.15.2",
    "smact==3.2.0",
    "spglib==2.6.0",
    "sympy==1.14.0",
    "torch==2.4.1",
    "torch-geometric==2.7.0",
    "torch-scatter==2.1.2+pt24cu124",
    "torch-sparse==0.6.18+pt24cu124",
    "tqdm==4.67.1",
    "wandb>=0.19,<0.23",
]

[project.optional-dependencies]
stability = [
    "matgl>=2,<3",
    "emmet-core==0.85.1",
    "mp-api==0.45.12",
]
legacy = [
    "chemparse>=0.3,<0.4",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools.packages.find]
include = ["cgdit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
find-links = ["https://data.pyg.org/whl/torch-2.4.0+cu124.html"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
