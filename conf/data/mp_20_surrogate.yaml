# ============================================================================
# Data config for M3GNet surrogate (formation energy regression)
# ============================================================================
root_path: ${oc.env:PROJECT_ROOT}/data/mp_20

# target property
prop: formation_energy_per_atom
prop_list: [formation_energy_per_atom, band_gap, e_above_hull]
num_targets: 1

# MP-20 training-split population statistics (ddof=0). These are used only to
# standardize the regression loss; predictions are returned in physical units.
target_stats:
  formation_energy_per_atom:
    mean: -1.219803
    std: 1.029374
  band_gap:
    mean: 0.791848
    std: 1.417749
  e_above_hull:
    mean: 0.017478
    std: 0.023265

# training control (required by train.yaml)
train_max_epochs: 300
early_stopping_patience: 50

# structure standardization
niggli: true
primitive: false
graph_method: crystalnn
tolerance: 0.1
max_atoms: 20
otf_graph: false
use_space_group: true
use_pos_index: false
lattice_scale_method: scale_length
preprocess_workers: 30
eval_model_name: mp20_m3gnet

datamodule:
  _target_: cgdit.pl_data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: cgdit.pl_data.dataset.CrystDataset
      name: MP20 Property Predictor Train
      path: ${data.root_path}/train.csv
      save_path: ${data.root_path}/train_sym.pt
      prop: ${data.prop}
      prop_list: ${data.prop_list}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      tolerance: ${data.tolerance}
      max_atoms: ${data.max_atoms}
      use_space_group: ${data.use_space_group}
      use_pos_index: ${data.use_pos_index}
      lattice_scale_method: ${data.lattice_scale_method}
      preprocess_workers: ${data.preprocess_workers}

    val:
      - _target_: cgdit.pl_data.dataset.CrystDataset
        name: MP20 Property Predictor Val
        path: ${data.root_path}/val.csv
        save_path: ${data.root_path}/val_sym.pt
        prop: ${data.prop}
        prop_list: ${data.prop_list}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        max_atoms: ${data.max_atoms}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

    test:
      - _target_: cgdit.pl_data.dataset.CrystDataset
        name: MP20 Property Predictor Test
        path: ${data.root_path}/test.csv
        save_path: ${data.root_path}/test_sym.pt
        prop: ${data.prop}
        prop_list: ${data.prop_list}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        tolerance: ${data.tolerance}
        max_atoms: ${data.max_atoms}
        use_space_group: ${data.use_space_group}
        use_pos_index: ${data.use_pos_index}
        lattice_scale_method: ${data.lattice_scale_method}
        preprocess_workers: ${data.preprocess_workers}

  num_workers:
    train: 0
    val: 0
    test: 0

  batch_size:
    train: 32
    val: 16
    test: 16
