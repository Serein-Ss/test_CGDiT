deterministic: true
random_seed: 42

pl_trainer:
  fast_dev_run: false
  accelerator: auto
  devices: 1
  precision: 32
  max_epochs: ${data.train_max_epochs}
  log_every_n_steps: 10
  accumulate_grad_batches: 2
  num_sanity_val_steps: 2
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  profiler: null

monitor_metric: val_mae
monitor_metric_mode: min

early_stopping:
  patience: ${data.early_stopping_patience}
  verbose: false

model_checkpoints:
  save_top_k: 1
  verbose: false
  save_last: false
