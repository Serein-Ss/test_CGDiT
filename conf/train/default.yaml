# reproducibility
deterministic: True
random_seed: 42

# training

pl_trainer:
  fast_dev_run: False # Enable this for debug purposes
#  gpus: 1
  accelerator: gpu
  devices: 1
  # accelerator: ddp
  precision: 32
  # max_steps: 10000
  max_epochs: ${data.train_max_epochs}
  log_every_n_steps: 1
  accumulate_grad_batches: 1
  num_sanity_val_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: value
  profiler: null # null simple advanced

monitor_metric: 'val_loss'
monitor_metric_mode: 'min'

early_stopping:
  patience: ${data.early_stopping_patience} # 60
  verbose: False

model_checkpoints:
  save_top_k: 1
  verbose: False
  save_last: False
