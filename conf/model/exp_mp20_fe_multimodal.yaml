# 多模态双通道 Adapter + 对比学习 + Curriculum Learning
# 对比基准：exp_mp20_fe.yaml（单通道 ConditioningEncoder）
_target_: cgdit.pl_modules.diffusion_multimodal.DiffusionMultimodal
time_dim: 256
latent_dim: 0
cost_coord: 1.
cost_lattice: 1.
cost_atom: 1.
max_neighbors: 20
radius: 7.
timesteps: 1000
cond_dropout_prob: 0.1       # base dropout（warmup 阶段会自动提高到 warmup_dropout）

# 多模态专属参数
proj_dim: 128                # 对比学习投影空间维度
contrastive_temperature: 0.07

# Curriculum Learning 三阶段调度
curriculum:
  warmup_epochs: 100         # Phase 1：纯扩散训练，对比权重=0，dropout=0.3
  ramp_epochs: 200           # Phase 2：线性增加对比权重，线性降低 dropout
  max_contrastive_weight: 0.1  # Phase 3：对比损失最大权重
  warmup_dropout: 0.3        # Phase 1 阶段的 cond_dropout_prob

conditions:
  formation_energy_per_atom:
    type: scalar
    scale: 1.029374
    shift: -1.219803

defaults:
  - decoder: cspnet
  - beta_scheduler: cosine
  - sigma_scheduler: wrapped
  - d3pm_scheduler: d3pm
