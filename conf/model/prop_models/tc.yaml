_target_: cgdit.prop_models.diffusion_backbone.DiffusionBackboneRegressor

target_prop: ${data.prop}
target_mean: ${data.target_stats.${data.prop}.mean}
target_std: ${data.target_stats.${data.prop}.std}
pretrained_model_path: null
time_dim: 256

# This exactly matches the decoder architecture used by the MP-20 diffusion
# checkpoints. Only the scalar head is new and always initialized from scratch.
decoder:
  _target_: cgdit.pl_modules.decoder.cspnet.CSPNet
  hidden_dim: 512
  latent_dim: 256
  max_atoms: 100
  num_layers: 6
  act_fn: silu
  dis_emb: sin
  num_freqs: 128
  edge_style: fc
  max_neighbors: 20
  cutoff: 7.0
  ln: true
  ip: true
  pred_type: true
  pred_scalar: true
  pooling: mean
