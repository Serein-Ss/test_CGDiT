# 多模态双通道 Adapter + 对比学习 + Curriculum Learning（三条件版本）
# 对比基准：exp_mp20_fe_bg_eh.yaml
_target_: cgdit.pl_modules.diffusion_multimodal.DiffusionMultimodal
time_dim: 256
latent_dim: 0
cost_coord: 1.
cost_lattice: 1.
cost_atom: 1.
max_neighbors: 20
radius: 7.
timesteps: 1000
cond_dropout_prob: 0.15      # 三条件 base dropout 略高

proj_dim: 128
contrastive_temperature: 0.07

curriculum:
  warmup_epochs: 100
  ramp_epochs: 200
  max_contrastive_weight: 0.1
  warmup_dropout: 0.4        # 三条件 warmup dropout 适当提高

conditions:
  formation_energy_per_atom:
    type: scalar
    scale: 1.029374
    shift: -1.219803
  band_gap:
    type: scalar
    scale: 1.417749
    shift: 0.791848
  e_above_hull:
    type: scalar
    scale: 0.023265
    shift: 0.017478

defaults:
  - decoder: cspnet
  - beta_scheduler: cosine
  - sigma_scheduler: wrapped
  - d3pm_scheduler: d3pm
