# ============================================================================
# Model config for M3GNet surrogate (formation energy regression)
# ============================================================================

_target_: cgdit.prop_models.gnn_models.m3gnet.M3GNetSurrogate

# Target metadata and training-set statistics. The network returns predictions
# in physical units, while its MSE loss is evaluated in standardized units.
target_prop: ${data.prop}
target_mean: ${data.target_stats.${data.prop}.mean}
target_std: ${data.target_stats.${data.prop}.std}

# ----------------------------------------------------------------------
# Core architecture
# ----------------------------------------------------------------------
n_atom_types: 100      # max atomic number supported (H=1 ... Am=95)

dim_node_embedding: 64    # 原子特征维度
dim_edge_embedding: 64    # 边特征维度
dim_state_embedding: 0    # 全局状态特征维度 (如果不包含 state 可设为 0)
units: 64                 # GNN 内部隐藏层维度

# ----------------------------------------------------------------------
# Geometry / physics settings
# ----------------------------------------------------------------------
cutoff: 5.0            # 2-body cutoff (Angstrom)
threebody_cutoff: 4.0  # 3-body cutoff
max_n: 3               # radial basis size
max_l: 3               # angular basis size
use_smooth: false      # 明确指定，避免默认值不确定
use_phi: false         # M3GNet 通常不使用 phi，显式设为 false 节省资源
rbf_type: SphericalBessel

# ----------------------------------------------------------------------
# Readout & Task Settings
# ----------------------------------------------------------------------
n_blocks: 3               # GNN 堆叠层数
readout: weighted      # weighted | mean
is_intensive: true     # [重要] 形成能是强度量(per atom)，设为 true。如果是总能量(total energy)设为 false。
task_type: regression  # 明确任务类型
ntargets: 1            # 预测标量

# ----------------------------------------------------------------------
# Optimization & Regularization
# ----------------------------------------------------------------------
activation_type: swish
dropout: 0.0           # 显式控制 dropout，如果过拟合可以设为 0.1 或 0.2

# These are accessed via self.hparams in LightningModule
loss:
  name: mse

metrics:
  - mae
